[package]
name = "uniworkspace-ai"
version = "0.1.0"
description = "Personal macOS shell for UniWorkspace AI"
authors = ["UniWorkspace"]
edition = "2021"

[lib]
name = "uniworkspace_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
