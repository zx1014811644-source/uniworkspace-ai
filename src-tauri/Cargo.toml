[package]
name = "uniworkspace-ai"
version = "0.1.0"
description = "Personal macOS shell for UniWorkspace AI"
authors = ["UniWorkspace"]
edition = "2021"

[lib]
name = "uniworkspace_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
url = "2"
uuid = { version = "1", features = ["v5"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", features = ["disable-encoding-assertions"] }
objc2-foundation = "0.3.2"
objc2-web-kit = "0.3.2"
block2 = "0.6.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
